<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POE2 시세 · 판매 계산기</title>
<meta name="description" content="Path of Exile 2 아이템 시세와 카오스·디바인·엑잘 중 어떤 화폐로 팔아야 이득인지 계산해 주는 비공식 도구">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ec; --muted: #8b93a3; --accent: #d9a441; --good: #4cc38a; --bad: #e5675a; --warn: #e0b04a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 90px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  header h1 { font-size: 20px; margin: 0; color: var(--accent); letter-spacing: -0.3px; }
  header .sp { flex: 1; }
  select, input[type=search], input[type=number] {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .rates { color: var(--muted); font-size: 13px; }
  .rates b { color: var(--text); font-weight: 600; }
  #auth { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  #auth img { width: 26px; height: 26px; border-radius: 50%; }
  #auth .who { font-size: 13px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #auth button.out { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; font-size: 13px; z-index: 20; display: none; max-width: calc(100% - 32px); }
  .toast.on { display: block; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a1406; font-weight: 600; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px 1fr 120px 90px 90px 30px 40px; gap: 10px; align-items: center;
    padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--panel2); }
  .row.head { cursor: default; color: var(--muted); font-size: 12px; background: var(--panel2); }
  .row img { width: 36px; height: 36px; object-fit: contain; }
  .nm { min-width: 0; }
  .nm .ko { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm .en { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .num small { display: block; color: var(--muted); font-size: 11px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  footer a { color: var(--muted); }

  /* 상세 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 10; }
  .modal.open { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 640px; padding: 18px; }
  .sheet-h { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .sheet-h img { width: 52px; height: 52px; object-fit: contain; }
  .sheet-h .ko { font-size: 18px; font-weight: 700; }
  .star { background: none; border: 0; padding: 2px; font-size: 20px; line-height: 1; color: #4a505c; cursor: pointer; }
  .star:hover { color: var(--muted); }
  .star.on { color: var(--accent); }
  .sheet-h .star { font-size: 24px; }
  .cmp { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 0; width: 38px; font-size: 11px; color: var(--muted); cursor: pointer; }
  .cmp:hover { border-color: var(--muted); }
  .cmp.on { background: #5aa9e6; border-color: #5aa9e6; color: #0b1622; font-weight: 700; }
  .cmpbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9; display: none; align-items: center; gap: 10px;
    background: var(--panel2); border: 1px solid #5aa9e6; border-radius: 12px; padding: 8px 10px 8px 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); max-width: calc(100% - 32px); }
  .cmpbar.on { display: flex; }
  .cmpbar .cnt { font-weight: 700; white-space: nowrap; }
  .cmpbar .names { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 380px; }
  .cmpbar button { border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; border: 1px solid var(--line); background: var(--panel); }
  .cmpbar button.go { background: #5aa9e6; border-color: #5aa9e6; color: #0b1622; font-weight: 700; }
  .cmpbar button:disabled { opacity: .5; cursor: default; }
  .sheet.wide { max-width: 980px; }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table.cmpt { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  table.cmpt th, table.cmpt td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.cmpt th { border-top: 0; background: var(--panel2); color: var(--muted); font-weight: 500; font-size: 12px; }
  table.cmpt th.it { text-align: left; }
  table.cmpt td.it { text-align: left; white-space: normal; min-width: 180px; }
  table.cmpt td.it .itw { display: flex; align-items: center; gap: 8px; }
  table.cmpt td.it img { width: 30px; height: 30px; object-fit: contain; }
  table.cmpt .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  table.cmpt small { display: block; color: var(--muted); font-size: 11px; }
  table.cmpt .rm { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .sheet-h .x { margin-left: auto; background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; }
  .qty { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .qty input { width: 100px; }
  .qty button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .verdict { background: rgba(217,164,65,.12); border: 1px solid rgba(217,164,65,.4); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .verdict b { color: var(--accent); }
  .cards { display: grid; gap: 8px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card.best { border-color: var(--accent); }
  .card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card .cur { font-weight: 700; }
  .card .got { font-size: 18px; font-weight: 700; margin-left: auto; font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.best { color: #1a1406; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .hist { margin-top: 14px; }
  .hist .lbl { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .hist svg { width: 100%; height: 70px; display: block; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; line-height: 1.6; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 34px 1fr 96px 30px 40px; }
    .cmpbar .names { display: none; }
    .row .c-vol, .row .c-ch { display: none; }
    .row img { width: 30px; height: 30px; }
    .modal { padding: 0; }
    .sheet { border-radius: 0; min-height: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>POE2 시세 · 판매 계산기</h1>
    <select id="league" aria-label="리그"></select>
    <span class="sp"></span>
    <span class="rates" id="rates"></span>
    <div id="auth"></div>
  </header>

  <div class="toolbar">
    <input type="search" id="q" placeholder="아이템 검색 (한글 / 영어)">
    <select id="sort" aria-label="정렬">
      <option value="price">가격 높은순</option>
      <option value="vol">거래량순</option>
      <option value="ch">7일 상승순</option>
      <option value="name">이름순</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>

  <footer>
    비공식 팬 사이트입니다. Grinding Gear Games 및 카카오게임즈와 관련이 없습니다.<br>
    시세 출처: <a href="https://poe.ninja/poe2/economy" target="_blank" rel="noopener">poe.ninja</a> ·
    한글 이름: 카카오게임즈 POE2 공식 거래소 데이터 · <span id="updated"></span><br>
    Google 로그인은 즐겨찾기 동기화에만 쓰며, Google 계정 고유 ID·이름·프로필 사진만 저장합니다 (이메일 저장 안 함). · <a href="/privacy.html">개인정보처리방침</a>
  </footer>
</div>

<div class="toast" id="toast"></div>
<div class="cmpbar" id="cmpbar"></div>
<div class="modal" id="cmpModal"><div class="sheet wide" id="cmpSheet"></div></div>
<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const IMG = 'https://web.poecdn.com';
const LEAGUE_KO = {
  'Forbidden Rites': '금단의 의식', 'HC Forbidden Rites': 'HC 금단의 의식',
  'Runes of Aldur': '알두르의 룬', 'HC Runes of Aldur': 'HC 알두르의 룬',
  'Standard': '스탠다드', 'Hardcore': '하드코어',
};
const CUR = {
  divine:  { ko: '디바인 오브', short: '디바인' },
  chaos:   { ko: '카오스 오브', short: '카오스' },
  exalted: { ko: '엑잘티드 오브', short: '엑잘' },
};
const THIN_VOL = 5;   // 하루 거래량(디바인 환산)이 이보다 적으면 "거래 적음"으로 보고 추천에서 제외

const S = { league: null, data: null, cat: 'all', q: '', sort: 'price', item: null, detail: null, qty: 1, fav: new Set(), user: null, clientId: null };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// 즐겨찾기 — 로그인하면 계정(서버)에, 아니면 이 브라우저에 저장 (아이템 id 기준이라 리그를 바꿔도 유지)
function localFavs() { try { return JSON.parse(load('fav') || '[]'); } catch (e) { return []; } }
S.fav = new Set(localFavs());
if (load('cat') === 'fav') S.cat = 'fav';
function refreshFavViews() {
  if (!S.data) return;
  renderChips(); renderList();
  if (S.item) renderDetail();
}
async function toggleFav(id) {
  const on = !S.fav.has(id);
  on ? S.fav.add(id) : S.fav.delete(id);
  refreshFavViews();
  if (!S.user) { store('fav', JSON.stringify([...S.fav])); return; }
  try {
    await apiPost('/api/favs', { id, on });
  } catch (e) {
    on ? S.fav.delete(id) : S.fav.add(id);   // 저장 실패 → 되돌림
    refreshFavViews();
    toast('즐겨찾기 저장 실패: ' + e.message);
  }
}

let toastTimer = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 3000);
}

// ── Google 로그인 ───────────────────────────────────────────────────────
async function apiPost(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function renderAuth() {
  const el = $('auth');
  if (S.user) {
    el.innerHTML = (S.user.picture ? `<img src="${esc(S.user.picture)}" alt="" referrerpolicy="no-referrer">` : '') +
      `<span class="who">${esc(S.user.name || '로그인됨')}</span><button class="out" id="logout">로그아웃</button>`;
    return;
  }
  el.innerHTML = '';
  if (!S.clientId) return;
  const draw = () => {
    google.accounts.id.initialize({ client_id: S.clientId, callback: onGoogleCredential, ux_mode: 'popup' });
    google.accounts.id.renderButton(el, { theme: 'filled_black', size: 'medium', shape: 'pill', text: 'signin', locale: 'ko' });
  };
  if (window.google && google.accounts) return draw();
  const sc = document.createElement('script');
  sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = draw;
  document.head.appendChild(sc);
}
async function onGoogleCredential(resp) {
  try {
    const j = await apiPost('/api/auth/google', { credential: resp.credential, favs: localFavs() });
    S.user = j.user; S.fav = new Set(j.favs);
    store('fav', '[]');   // 이 브라우저 즐겨찾기는 계정으로 옮겼으므로 비움
    renderAuth(); refreshFavViews();
    toast('로그인했습니다. 즐겨찾기가 계정에 저장됩니다.');
  } catch (e) { toast('로그인 실패: ' + e.message); }
}
async function logout() {
  try { await apiPost('/api/auth/logout'); } catch (e) {}
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  S.user = null; S.fav = new Set(localFavs());
  renderAuth(); refreshFavViews();
}
async function loadMe() {
  try {
    const r = await fetch('/api/me');
    const j = await r.json();
    S.clientId = j.clientId;
    if (j.user) { S.user = j.user; S.fav = new Set(j.favs || []); refreshFavViews(); }
  } catch (e) {}
  renderAuth();
}
function starBtn(id) {
  const on = S.fav.has(id);
  return `<button class="star${on ? ' on' : ''}" data-fav="${esc(id)}" aria-label="${on ? '즐겨찾기 해제' : '즐겨찾기'}" title="${on ? '즐겨찾기 해제' : '즐겨찾기'}">${on ? '★' : '☆'}</button>`;
}

function fmt(n) {
  if (n == null || !isFinite(n)) return '-';
  const a = Math.abs(n);
  const d = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : a >= 0.1 ? 3 : 4;
  return n.toLocaleString('ko-KR', { maximumFractionDigits: d });
}
// 1개당 디바인 가치를 보기 좋은 단위로 (1 디바인 이상 → 디바인, 그 아래 → 카오스, 1 카오스 미만 → 엑잘)
function priceLabel(div) {
  const r = S.data.rates || {};
  if (div >= 1 || !r.chaos) return { main: fmt(div) + ' 디바인', sub: r.chaos ? fmt(div * r.chaos) + ' 카오스' : '' };
  const c = div * r.chaos;
  if (c >= 1 || !r.exalted) return { main: fmt(c) + ' 카오스', sub: fmt(div) + ' 디바인' };
  return { main: fmt(div * r.exalted) + ' 엑잘', sub: fmt(c) + ' 카오스' };
}

async function api(path) {
  const r = await fetch(path);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function loadLeague(league) {
  $('list').innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    S.data = await api('/api/snapshot' + (league ? '?league=' + encodeURIComponent(league) : ''));
  } catch (e) {
    $('list').innerHTML = '<div class="empty">시세를 불러오지 못했습니다. (' + esc(e.message) + ')</div>';
    return;
  }
  S.league = S.data.league;
  store('league', S.league);
  $('league').innerHTML = S.data.leagues.map(l =>
    `<option value="${esc(l)}"${l === S.league ? ' selected' : ''}>${esc(LEAGUE_KO[l] || l)}</option>`).join('');
  const r = S.data.rates || {};
  $('rates').innerHTML = r.exalted
    ? `1 디바인 = <b>${fmt(r.chaos)}</b> 카오스 = <b>${fmt(r.exalted)}</b> 엑잘` : '';
  $('updated').textContent = '갱신: ' + new Date(S.data.updatedAt).toLocaleString('ko-KR');
  renderChips();
  renderList();
  renderCmpBar();
}

function renderChips() {
  const types = [...new Set(S.data.items.map(i => i.type))];
  if (S.cat !== 'all' && S.cat !== 'fav' && !types.includes(S.cat)) S.cat = 'all';
  const chips = [['all', '전체'], ['fav', `★ 즐겨찾기 ${S.fav.size}`]].concat(types.map(t => [t, S.data.typeKo[t] || t]));
  $('chips').innerHTML = chips.map(([k, l]) =>
    `<button class="chip${S.cat === k ? ' on' : ''}" data-cat="${esc(k)}">${esc(l)}</button>`).join('');
}

function filtered() {
  const q = S.q.trim().toLowerCase();
  let a = S.data.items.filter(i =>
    (S.cat === 'all' || (S.cat === 'fav' ? S.fav.has(i.id) : i.type === S.cat)) &&
    (!q || (i.ko || '').toLowerCase().includes(q) || i.en.toLowerCase().includes(q)));
  const by = {
    price: (x, y) => y.div - x.div,
    vol: (x, y) => (y.vol || 0) - (x.vol || 0),
    ch: (x, y) => (y.ch7 || 0) - (x.ch7 || 0),
    name: (x, y) => (x.ko || x.en).localeCompare(y.ko || y.en, 'ko'),
  }[S.sort];
  return a.sort(by);
}

function renderList() {
  const a = filtered();
  if (!a.length) {
    $('list').innerHTML = S.cat === 'fav' && !S.q.trim()
      ? '<div class="empty">즐겨찾기한 아이템이 없습니다.<br>목록이나 상세 화면의 ☆를 누르면 여기에 모아 볼 수 있습니다.</div>'
      : '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }
  const head = `<div class="row head"><span></span><span>아이템</span><span class="num">1개 시세</span>
    <span class="num c-ch">7일</span><span class="num c-vol">거래량/일</span><span></span><span></span></div>`;
  $('list').innerHTML = head + a.map(i => {
    const p = priceLabel(i.div);
    const ch = i.ch7 == null ? '-' : (i.ch7 > 0 ? '+' : '') + fmt(i.ch7) + '%';
    const cls = i.ch7 > 0 ? 'up' : i.ch7 < 0 ? 'down' : '';
    return `<div class="row" data-id="${esc(i.id)}">
      ${i.img ? `<img src="${IMG + esc(i.img)}" alt="" loading="lazy">` : '<span></span>'}
      <div class="nm"><div class="ko">${esc(i.ko || i.en)}</div>${i.ko ? `<div class="en">${esc(i.en)}</div>` : ''}</div>
      <div class="num">${esc(p.main)}<small>${esc(p.sub)}</small></div>
      <div class="num c-ch ${cls}">${ch}</div>
      <div class="num c-vol">${fmt(i.vol)}<small>디바인</small></div>
      ${starBtn(i.id)}${cmpBtn(i.id)}
    </div>`;
  }).join('');
}

// ── 판매 계산 ───────────────────────────────────────────────────────────
// 거래소는 개수를 정수로만 걸 수 있으므로 받는 화폐는 버림 처리
function bestBundle(rate) {
  let best = null;
  const k0 = Math.max(1, Math.ceil(1 / rate - 1e-9));   // 받는 화폐가 최소 1개가 되는 개수부터
  for (let k = k0; k <= k0 + 40; k++) {
    const m = Math.floor(k * rate + 1e-9);
    if (m < 1) continue;
    const eff = m / (k * rate);
    if (!best || eff > best.eff + 1e-9) best = { k, m, eff };
    if (eff >= 0.99) return { k, m, eff };
  }
  return best;
}

function calc(d = S.detail, n = S.qty) {
  const r = d.rates || S.data.rates || {};
  const per = { divine: 1, chaos: r.chaos, exalted: r.exalted };   // 1 디바인당 해당 화폐 개수
  const rows = d.pairs.filter(p => CUR[p.id] && per[p.id] && p.rate > 0).map(p => {
    const got = Math.floor(n * p.rate + 1e-9);
    return { ...p, got, valueDiv: got / per[p.id], thin: (p.vol || 0) < THIN_VOL, bundle: bestBundle(p.rate) };
  });
  const pool = rows.some(x => !x.thin) ? rows.filter(x => !x.thin) : rows;
  const best = pool.reduce((a, b) => (b.valueDiv > (a ? a.valueDiv : -1) ? b : a), null);
  return { rows, best, per };
}

function renderDetail() {
  const i = S.item, d = S.detail;
  const head = `<div class="sheet-h">
      ${i.img ? `<img src="${IMG + esc(i.img)}" alt="">` : ''}
      <div><div class="ko">${esc(i.ko || i.en)}</div><div class="en" style="color:var(--muted);font-size:12px">${esc(i.en)} · ${esc(S.data.typeKo[i.type] || i.type)}</div></div>
      <span style="margin-left:auto"></span>${starBtn(i.id)}
      <button class="x" data-close aria-label="닫기" style="margin-left:4px">×</button>
    </div>`;
  if (!d) { $('sheet').innerHTML = head + '<div class="empty">화폐별 시세 불러오는 중…</div>'; return; }
  if (d.error) { $('sheet').innerHTML = head + `<div class="empty">불러오지 못했습니다. (${esc(d.error)})</div>`; return; }

  const { rows, best, per } = calc();
  const n = S.qty;
  const qty = `<div class="qty">판매 개수
      <button data-q="-1">−</button><input type="number" id="qtyIn" min="1" max="9999" value="${n}"><button data-q="1">+</button>
    </div>`;
  if (!rows.length) { $('sheet').innerHTML = head + qty + '<div class="empty">카오스·디바인·엑잘 직거래 시세가 없습니다.</div>'; return; }

  const verdict = best
    ? `<div class="verdict">${n}개를 팔 때는 <b>${CUR[best.id].ko}</b>로 파는 게 가장 많이 받습니다.
        <span style="color:var(--muted)">(${fmt(best.got)} ${CUR[best.id].short} ≈ ${fmt(best.valueDiv)} 디바인 가치)</span></div>`
    : '';
  const sorted = rows.slice().sort((a, b) => b.valueDiv - a.valueDiv);
  const cards = sorted.map(x => {
    const isBest = best && x.id === best.id;
    const diff = best && !isBest && best.valueDiv > 0 ? Math.round((x.valueDiv / best.valueDiv - 1) * 100) : null;
    const b = x.bundle;
    const bundleTxt = b ? (b.k === 1 ? `1개씩 팔아도 손해 거의 없음` :
      `추천 묶음 <b>${b.k}개 : ${b.m} ${CUR[x.id].short}</b> (시세의 ${Math.round(b.eff * 100)}%)`) : '';
    const others = Object.keys(CUR).filter(c => c !== x.id && per[c])
      .map(c => `${fmt(x.valueDiv * per[c])} ${CUR[c].short}`).join(' · ');
    return `<div class="card${isBest ? ' best' : ''}">
        <div class="top">
          <span class="cur">${CUR[x.id].ko}</span>
          ${isBest ? '<span class="tag best">추천</span>' : ''}
          ${x.thin ? '<span class="tag warn">거래 적음</span>' : ''}
          ${diff != null ? `<span class="tag">${diff > 0 ? '+' : ''}${diff}%</span>` : ''}
          <span class="got">${fmt(x.got)} ${CUR[x.id].short}</span>
        </div>
        <div class="sub">시장가 1개당 ${fmt(x.rate)} ${CUR[x.id].short} · ${n}개 = ${fmt(n * x.rate)} → 버림 ${fmt(x.got)} · 환산 ${others}</div>
        <div class="sub">${bundleTxt} · 거래량 하루 ${fmt(x.vol)} 디바인어치</div>
      </div>`;
  }).join('');

  const dv = d.pairs.find(p => p.id === 'divine') || d.pairs[0];
  $('sheet').innerHTML = head + qty + verdict + `<div class="cards">${cards}</div>` +
    (dv && dv.history.length > 1 ? `<div class="hist"><div class="lbl">최근 ${dv.history.length}일 ${CUR[dv.id] ? CUR[dv.id].short : dv.id} 시세</div>${spark(dv.history)}</div>` : '') +
    `<div class="note">• 거래소는 개수를 정수로만 걸 수 있어 받는 화폐는 버림으로 계산했습니다. 1개씩 팔면 손해가 크면 "추천 묶음" 비율로 올려 보세요.<br>
      • 하루 거래량이 ${THIN_VOL} 디바인어치 미만인 화폐는 잘 안 팔릴 수 있어 추천에서 뺐습니다.<br>
      • 시세는 poe.ninja 집계값이라 실제 호가와 다를 수 있습니다. 올리기 전에 거래소 호가를 확인하세요.</div>`;
}

function spark(h) {
  const w = 600, ht = 70, pad = 6;
  const v = h.map(x => x.rate), mn = Math.min(...v), mx = Math.max(...v), rg = mx - mn || 1;
  const pts = v.map((y, i) => `${(pad + i * (w - 2 * pad) / (v.length - 1)).toFixed(1)},${(ht - pad - (y - mn) / rg * (ht - 2 * pad)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="#d9a441" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg><div class="lbl" style="display:flex;justify-content:space-between"><span>최저 ${fmt(mn)}</span><span>최고 ${fmt(mx)}</span></div>`;
}

// 아이템 화폐별 시세 — 같은 리그·아이템은 5분 동안 다시 받지 않음 (상세 화면과 비교 화면이 같이 씀)
const detailCache = new Map();
async function fetchDetail(i) {
  const key = S.league + '|' + i.id, hit = detailCache.get(key);
  if (hit && Date.now() - hit.at < 5 * 60 * 1000) return hit.d;
  let d;
  try {
    d = await api(`/api/item?league=${encodeURIComponent(S.league)}&type=${encodeURIComponent(i.type)}&id=${encodeURIComponent(i.did || i.id)}`);
    detailCache.set(key, { at: Date.now(), d });
  } catch (e) { d = { error: e.message }; }
  return d;
}

// ── 시세 비교 ───────────────────────────────────────────────────────────
// 목록의 "비교" 버튼으로 담은 아이템(최대 6개)만 표와 그래프로 나란히 비교. 담은 목록은 이 브라우저에 저장
const MAX_CMP = 6;
const CMP_COLORS = ['#d9a441', '#5aa9e6', '#4cc38a', '#e5675a', '#b38ef3', '#d0d4dc'];
S.cmp = new Set((() => { try { return JSON.parse(load('cmp') || '[]'); } catch (e) { return []; } })());
S.cmpDetails = {};
function cmpBtn(id) {
  const on = S.cmp.has(id);
  return `<button class="cmp${on ? ' on' : ''}" data-cmp="${esc(id)}" title="${on ? '비교에서 빼기' : '비교에 담기'}">비교</button>`;
}
function cmpItems() { return [...S.cmp].map(id => S.data.items.find(x => x.id === id)).filter(Boolean); }
function toggleCmp(id) {
  if (S.cmp.has(id)) S.cmp.delete(id);
  else if (S.cmp.size >= MAX_CMP) return toast(`비교는 최대 ${MAX_CMP}개까지 담을 수 있습니다`);
  else S.cmp.add(id);
  saveCmp();
}
function saveCmp() {
  store('cmp', JSON.stringify([...S.cmp]));
  renderList(); renderCmpBar();
  if ($('cmpModal').classList.contains('open')) { if (cmpItems().length) renderCompare(); else closeCompare(); }
}
function renderCmpBar() {
  const items = S.data ? cmpItems() : [];
  const bar = $('cmpbar');
  bar.classList.toggle('on', items.length > 0);
  if (!items.length) return;
  bar.innerHTML = `<span class="cnt">비교 ${items.length}/${MAX_CMP}</span>
    <span class="names">${esc(items.map(i => i.ko || i.en).join(', '))}</span>
    <button data-cmp-clear>비우기</button>
    <button class="go" data-cmp-open${items.length < 2 ? ' disabled title="2개 이상 담아 주세요"' : ''}>비교하기</button>`;
}
async function openCompare() {
  const items = cmpItems();
  if (items.length < 2) return toast('비교할 아이템을 2개 이상 담아 주세요');
  $('cmpModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  S.cmpDetails = {};
  renderCompare();
  await Promise.all(items.map(async i => {
    S.cmpDetails[i.id] = await fetchDetail(i);
    if ($('cmpModal').classList.contains('open')) renderCompare();
  }));
}
function closeCompare() { $('cmpModal').classList.remove('open'); if (!S.item) document.body.style.overflow = ''; }

// 1개 팔 때 가장 많이 받는 화폐. 1개로는 어느 화폐도 1개가 안 되는 싼 아이템은 묶음 비율로 안내
function cmpRec(d) {
  const { rows, best, per } = calc(d, 1);
  if (best && best.got > 0) return `<b>${CUR[best.id].short}</b><small>${fmt(best.got)}개 받음</small>`;
  const pool = rows.some(x => !x.thin) ? rows.filter(x => !x.thin) : rows;
  let pick = null;
  for (const x of pool) {
    if (!x.bundle) continue;
    const v = x.bundle.m / x.bundle.k / per[x.id];   // 1개당 디바인 가치
    if (!pick || v > pick.v) pick = { x, v };
  }
  if (!pick) return '-';
  return `<b>${CUR[pick.x.id].short}</b><small>묶어서 ${pick.x.bundle.k}개 : ${pick.x.bundle.m}</small>`;
}

function renderCompare() {
  const items = cmpItems().sort((a, b) => b.div - a.div);
  const color = {};
  [...S.cmp].forEach((id, k) => { color[id] = CMP_COLORS[k % CMP_COLORS.length]; });
  const top = items.length ? items[0].div : 0;
  const pairCell = (d, cur) => {
    if (!d) return '<td>…</td>';
    const p = !d.error && d.pairs.find(x => x.id === cur);
    if (!p) return '<td>-</td>';
    return `<td>${fmt(p.rate)}<small>${(p.vol || 0) < THIN_VOL ? '거래 적음' : '하루 ' + fmt(p.vol) + ' 디바인어치'}</small></td>`;
  };
  const rows = items.map(i => {
    const d = S.cmpDetails[i.id], p = priceLabel(i.div);
    let rec = '<td>…</td>';
    if (d && d.error) rec = '<td>-</td>';
    else if (d) {
      rec = `<td>${cmpRec(d)}</td>`;
    }
    const ch = i.ch7 == null ? '-' : (i.ch7 > 0 ? '+' : '') + fmt(i.ch7) + '%';
    return `<tr>
      <td class="it"><div class="itw"><span class="dot" style="background:${color[i.id]}"></span>
        ${i.img ? `<img src="${IMG + esc(i.img)}" alt="">` : ''}
        <span>${esc(i.ko || i.en)}${i.ko ? `<small>${esc(i.en)}</small>` : ''}</span></div></td>
      <td><b>${esc(p.main)}</b><small>${esc(p.sub)}</small></td>
      <td>${top > 0 ? (i.div / top * 100 < 1 ? '1% 미만' : Math.round(i.div / top * 100) + '%') : '-'}</td>
      ${pairCell(d, 'divine')}${pairCell(d, 'chaos')}${pairCell(d, 'exalted')}
      ${rec}
      <td class="${i.ch7 > 0 ? 'up' : i.ch7 < 0 ? 'down' : ''}">${ch}</td>
      <td><button class="rm" data-cmp-remove="${esc(i.id)}" title="비교에서 빼기">×</button></td>
    </tr>`;
  }).join('');
  const missing = S.cmp.size - items.length;
  $('cmpSheet').innerHTML = `<div class="sheet-h"><div><div class="ko">시세 비교</div>
      <div style="color:var(--muted);font-size:12px">${esc(LEAGUE_KO[S.league] || S.league)} · ${items.length}개 · 비싼 순</div></div>
      <button class="x" data-close aria-label="닫기">×</button></div>
    <div class="tbl-wrap"><table class="cmpt">
      <tr><th class="it">아이템</th><th>1개 시세</th><th>최고가 대비</th><th>디바인 직거래</th><th>카오스 직거래</th><th>엑잘 직거래</th><th>1개 팔 때 추천</th><th>7일</th><th></th></tr>
      ${rows}
    </table></div>
    ${cmpChart(items, color)}
    <div class="note">• 직거래 칸은 아이템 1개를 그 화폐로 팔 때 받는 시장가입니다 (버림 전).
      "1개 팔 때 추천"은 버림까지 반영해 가장 많이 받는 화폐입니다.<br>
      ${missing > 0 ? `• 담아둔 아이템 중 ${missing}개는 이 리그에 시세가 없어 빠졌습니다.<br>` : ''}
      • 개수를 바꿔 계산하려면 목록에서 아이템을 눌러 상세 화면을 여세요.</div>`;
}

// 최근 14일 디바인 시세를 첫날 대비 변동률(%)로 겹쳐 그림 — 가격대가 달라도 흐름을 비교할 수 있게
function cmpChart(items, color) {
  const series = items.map(i => {
    const d = S.cmpDetails[i.id];
    const p = d && !d.error && (d.pairs.find(x => x.id === 'divine') || d.pairs[0]);
    return p && p.history.length > 1 ? { id: i.id, name: i.ko || i.en, h: p.history } : null;
  }).filter(Boolean);
  if (!series.length) return '';
  const days = [...new Set(series.flatMap(x => x.h.map(y => y.t)))].sort();
  const lines = series.map(x => {
    const base = x.h[0].rate;
    return { ...x, pts: x.h.map(y => ({ x: days.indexOf(y.t), y: (y.rate / base - 1) * 100 })) };
  });
  const ys = lines.flatMap(l => l.pts.map(q => q.y)).concat(0);
  const mn = Math.min(...ys), mx = Math.max(...ys), rg = mx - mn || 1;
  const w = 900, ht = 180, pad = 8;
  const X = x => pad + x * (w - 2 * pad) / Math.max(1, days.length - 1);
  const Y = y => ht - pad - (y - mn) / rg * (ht - 2 * pad);
  const paths = lines.map(l => `<polyline points="${l.pts.map(q => X(q.x).toFixed(1) + ',' + Y(q.y).toFixed(1)).join(' ')}"
      fill="none" stroke="${color[l.id]}" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('');
  const day = t => t.slice(5, 10).replace('-', '/');
  const pct = v => (v > 0 ? '+' : '') + fmt(v) + '%';
  return `<div class="hist"><div class="lbl">최근 ${days.length}일 시세 흐름 (첫날 대비 %, 디바인 기준)</div>
    <svg viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" style="height:180px">
      <line x1="${pad}" x2="${w - pad}" y1="${Y(0)}" y2="${Y(0)}" stroke="#3a404c" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      ${paths}
    </svg>
    <div class="lbl" style="display:flex;justify-content:space-between"><span>${day(days[0])} · 최저 ${pct(mn)}</span><span>최고 ${pct(mx)} · ${day(days[days.length - 1])}</span></div>
    <div class="legend">${lines.map(l => `<span><i style="background:${color[l.id]}"></i>${esc(l.name)} ${pct(l.pts[l.pts.length - 1].y)}</span>`).join('')}</div>
  </div>`;
}

async function openItem(id) {
  const i = S.data.items.find(x => x.id === id);
  if (!i) return;
  S.item = i; S.detail = null;
  $('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderDetail();
  S.detail = await fetchDetail(i);
  if (S.item === i) renderDetail();
}
function closeItem() { $('modal').classList.remove('open'); document.body.style.overflow = ''; S.item = null; }

// ── 이벤트 ─────────────────────────────────────────────────────────────
$('league').addEventListener('change', e => loadLeague(e.target.value));
$('q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('sort').addEventListener('change', e => { S.sort = e.target.value; renderList(); });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  S.cat = b.dataset.cat; store('cat', S.cat); renderChips(); renderList();
});
$('list').addEventListener('click', e => {
  const f = e.target.closest('[data-fav]'); if (f) return toggleFav(f.dataset.fav);
  const c = e.target.closest('[data-cmp]'); if (c) return toggleCmp(c.dataset.cmp);
  const r = e.target.closest('.row[data-id]'); if (r) openItem(r.dataset.id); });
$('cmpbar').addEventListener('click', e => {
  if (e.target.closest('[data-cmp-open]')) return openCompare();
  if (e.target.closest('[data-cmp-clear]')) { S.cmp.clear(); saveCmp(); }
});
$('cmpModal').addEventListener('click', e => {
  if (e.target === $('cmpModal') || e.target.closest('[data-close]')) return closeCompare();
  const rm = e.target.closest('[data-cmp-remove]');
  if (rm) { S.cmp.delete(rm.dataset.cmpRemove); saveCmp(); }
});
$('modal').addEventListener('click', e => {
  if (e.target === $('modal') || e.target.closest('[data-close]')) return closeItem();
  const f = e.target.closest('[data-fav]'); if (f) return toggleFav(f.dataset.fav);
  const q = e.target.closest('[data-q]');
  if (q) { S.qty = Math.min(9999, Math.max(1, S.qty + Number(q.dataset.q))); renderDetail(); }
});
$('modal').addEventListener('change', e => {
  if (e.target.id !== 'qtyIn') return;
  S.qty = Math.min(9999, Math.max(1, Math.floor(Number(e.target.value) || 1)));
  renderDetail();
});
$('auth').addEventListener('click', e => { if (e.target.id === 'logout') logout(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('cmpModal').classList.contains('open')) closeCompare(); else if (S.item) closeItem();
});

loadLeague(load('league'));
loadMe();
</script>
